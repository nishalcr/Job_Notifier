name: Multi-Company Jobs Notifier

# Triggered every 10 minutes by an external cron-job.org job via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      companies:
        description: Comma-separated company slugs to scrape
        required: false
        default: apple,amazon,cvs,cvs_wd,goldman-sachs,google,lyft,meta,salesforce,uber,nvidia,hp,samsung,cisco,jpmc,dell,doordash,ibm,disney,paramount,ford,paypal,intel,amd,yahoo,reddit,redhat,capitalone,amex,stripe,netflix,microsoft,databricks,zscaler,snowflake,godaddy

permissions:
  contents: write

concurrency:
  group: seen-jobs-state
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Check out the branch tip, not the commit from when this run was queued:
          # a queued run must see seen_jobs/ saved by the run it waited for.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run scraper
        id: run_scraper
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPANIES: ${{ inputs.companies || 'apple,amazon,cvs,cvs_wd,goldman-sachs,google,lyft,meta,salesforce,uber,nvidia,hp,samsung,cisco,jpmc,dell,doordash,ibm,disney,paramount,ford,paypal,intel,amd,yahoo,reddit,redhat,capitalone,amex,stripe,netflix,microsoft,databricks,zscaler,snowflake,godaddy' }}
        run: python scraper.py

      - name: Upload scraper diagnostics
        if: steps.run_scraper.outcome == 'failure' && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: scraper-diagnostics
          path: artifacts/
          if-no-files-found: ignore

      - name: Commit updated seen-job files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs
          if git diff --cached --quiet; then
            echo "No seen_jobs changes to commit."
            exit 0
          fi
          git commit -m "chore: update seen jobs [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
